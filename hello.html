        // something, open it up so you can see the Properties
        const panel = document.getElementById("leftPanel");
        if (item !== null && panel.offsetWidth < 150) panel.style.width = "180px";
      }

      // Show the Properties that fit what's selected:
      //   nothing selected = a hint
      //   shape or line    = Colour, Thickness, Size (W and H) and Rotation
      //   text box         = Colour, Font, Thickness, Size (text size) and Rotation
      function updatePropertiesPanel() {
        const isText = selectedItem !== null && selectedItem.classList.contains("textItem");
        const isShape = selectedItem !== null && selectedItem.classList.contains("shapeItem");
        const anything = selectedItem !== null;
        document.getElementById("propsNothing").style.display = anything ? "none" : "block";
        document.getElementById("propsColour").style.display = anything ? "block" : "none";
        document.getElementById("propsFont").style.display = isText ? "block" : "none";
        document.getElementById("propsThickness").style.display = anything ? "block" : "none";
        document.getElementById("propsSize").style.display = anything ? "block" : "none";
        document.getElementById("sizeShape").style.display = isShape ? "block" : "none";
        document.getElementById("sizeText").style.display = isText ? "block" : "none";
        document.getElementById("propsRotation").style.display = anything ? "block" : "none";

        // Outline and Fill. Lines have no inside, and their outline IS the
        // line, so they get neither Fill nor the Show outline tick box
        const isLine = isShape && selectedItem.dataset.shape === "line";
        document.getElementById("propsBoxOutline").style.display = isText ? "block" : "none";
        document.getElementById("propsFill").style.display = anything && !isLine ? "block" : "none";
        document.getElementById("shapeOutlineLabel").style.display = isShape && !isLine ? "block" : "none";

        // For text, Colour and Thickness are for the letters.
        // For shapes and lines, they're for the outline
        document.getElementById("colourHeading").textContent = isText ? "Text colour" : isLine ? "Line colour" : "Outline colour";
        document.getElementById("thicknessHeading").textContent = isText ? "Text thickness" : isLine ? "Line thickness" : "Outline thickness";

        showItemNumbers(); // fill in the selected item's own numbers
        if (anything) showItemLook(); // and its outline and fill
      }

      // Delete key: delete the selected text box or shape.
      // (Not while you're typing in it. Then Delete just deletes letters.)
      document.addEventListener("keydown", function (event) {
        if (event.key !== "Delete" && event.key !== "Backspace") return;
        if (selectedItem === null) return;
        // Typing in a text box (or any other box)? Let the key work normally
        const active = document.activeElement;
        if (active.isContentEditable || active.tagName === "INPUT") return;

        event.preventDefault(); // stop Backspace doing anything else
        deleteSelected();
      });

      // Delete key or 🗑 Delete button: delete the selected item
      function deleteSelected() {
        if (selectedItem === null) return;
        selectedItem.remove();
        selectItem(null);
        saveState(); // remember it for Undo
      }

      // ===== Undo =====
      // After every change, saveState() takes a "snapshot" of everything:
      // the drawing, every text box and shape, and the line ends.
      // The snapshots go in a list called undoHistory. Undo goes back to the
      // snapshot before. There's no limit: every step is kept until you
      // close or refresh the page.
      const undoHistory = [];
      let canvasChanged = true; // did the drawing change since the last snapshot?
      let lastImage = null;     // the drawing in the last snapshot

      function saveState() {
        // Turning the canvas into a picture is slow-ish, so only do it
        // when the drawing really changed. Otherwise reuse the last one
        if (canvasChanged || lastImage === null) {
          lastImage = canvas.toDataURL("image/png");
          canvasChanged = false;
        }

        const state = {
          image: lastImage,
          // JSON.stringify turns the list into text, so we can easily
          // check if anything changed
          items: JSON.stringify(
            Array.from(document.querySelectorAll(".canvasItem")).map(itemToData)
          ),
          lineEnds: JSON.stringify(lineEnds),
        };

        // Nothing changed since the last snapshot? Don't save a copy
        const last = undoHistory[undoHistory.length - 1];
        if (last && last.image === state.image && last.items === state.items) return;

        undoHistory.push(state);
        updateUndoButton();
      }

      // Undo button or Ctrl+Z: go back one step
      function undo() {
        if (undoHistory.length < 2) return; // nothing to undo
        // Finish typing first, so the text box is saved properly
        if (document.activeElement.className === "textInside") {
          document.activeElement.blur();
        }
        undoHistory.pop(); // throw away the newest snapshot...
        restoreState(undoHistory[undoHistory.length - 1]); // ...and go back to the one before
        updateUndoButton();
      }

      // Put everything back the way it was in a snapshot
      let restoreNumber = 0;
      function restoreState(state) {
        // The drawing: load the picture, then paint it onto the canvas.
        // Loading takes a moment, so it happens in img.onload
        const myNumber = ++restoreNumber;
        const img = new Image();
        img.onload = function () {
          if (myNumber !== restoreNumber) return; // a newer undo started, skip this
          clearCanvas();
          pen.drawImage(img, 0, 0);
        };
        img.src = state.image;
        lastImage = state.image;
        canvasChanged = false;

        // The text boxes and shapes: remove them all, then rebuild them
        selectedItem = null;
        for (const item of document.querySelectorAll(".canvasItem")) item.remove();
        for (const data of JSON.parse(state.items)) dataToItem(data);
        setTool(tool); // make the rebuilt items behave like the others

        // The line ends (for the blue joining dot)
        lineEnds.length = 0;
        for (const end of JSON.parse(state.lineEnds)) lineEnds.push(end);
        hideDot();
      }

      // Write down everything about an item, so it can be rebuilt later
      function itemToData(item) {
        const data = {
          left: item.style.left,
          top: item.style.top,
          angle: item.dataset.angle || 0,
          fill: item.dataset.fill || "none",
        };
        if (item.classList.contains("shapeItem")) {
          data.kind = "shape";
          data.shape = item.dataset.shape;
          data.colour = item.dataset.colour;
          data.thickness = item.dataset.thickness;
          data.outline = item.dataset.outline;
          data.width = item.style.width;
          data.height = item.style.height;
        } else {
          const text = item.querySelector(".textInside");
          data.kind = "text";
          data.size = item.dataset.size;
          data.colour = text.style.color;
          data.font = text.style.fontFamily;
          data.thickness = text.style.webkitTextStrokeWidth; // the whole box's thickness
          data.boxOutline = item.dataset.boxOutline;
          data.boxOutlineColour = item.dataset.boxOutlineColour;
          data.boxOutlineWidth = item.dataset.boxOutlineWidth;
          data.html = text.innerHTML; // the text, with its fonts and colours
        }
        return data;
      }

      // Rebuild an item from what itemToData wrote down
      function dataToItem(data) {
        const x = parseFloat(data.left);
        const y = parseFloat(data.top);
        let item;
        if (data.kind === "shape") {
          item = buildShape(data.shape, x, y, data.colour, data.thickness, data.width, data.height);
        } else {
          item = buildTextBox(x, y, data.size, data.colour);
          const text = item.querySelector(".textInside");
          text.style.fontFamily = data.font;
          text.style.webkitTextStrokeWidth = data.thickness || "";
          text.innerHTML = data.html;
          item.dataset.boxOutline = data.boxOutline || "off";
          item.dataset.boxOutlineColour = data.boxOutlineColour || "#000000";
          item.dataset.boxOutlineWidth = data.boxOutlineWidth || 2;
        }
        item.dataset.fill = data.fill || "none";
        if (data.kind === "shape") item.dataset.outline = data.outline || "on";
        applyLook(item);
        // applyLook keeps the middle still, which can nudge the box,
        // so put it back exactly where it was
        item.style.left = data.left;
        item.style.top = data.top;
        setAngle(item, Number(data.angle));
      }

      // Grey out the Undo button when there's nothing to undo
      function updateUndoButton() {
        document.getElementById("undoButton").disabled = undoHistory.length < 2;
      }

      // Ctrl+Z = Undo (but not while typing, where Ctrl+Z undoes your typing)
      document.addEventListener("keydown", function (event) {
        if (!(event.ctrlKey || event.metaKey) || event.key.toLowerCase() !== "z") return;
        const active = document.activeElement;
        if (active.isContentEditable || active.tagName === "INPUT") return;
        event.preventDefault();
        undo();
      });

      // Pick the right border for an item:
      //   typing in it   = dark dashed
      //   selected       = blue
      //   not selected   = no border
      // Only the selected item shows its corner and rotate handles.
      function updateBorder(item) {
        const text = item.querySelector(".textInside");
        if (document.activeElement === text) {
          item.style.border = "1px dashed #333";
        } else if (item === selectedItem) {
          item.style.border = "1px solid #0078d7";
        } else {
          item.style.border = "1px dashed transparent";
        }

        const showHandles = item === selectedItem && tool === "cursor";
        for (const handle of item.querySelectorAll(".handle")) {
          handle.style.display = showHandles ? "block" : "none";
        }
      }

      function updateAllBorders() {
        for (const item of document.querySelectorAll(".canvasItem")) {
          updateBorder(item);
        }
        // The Delete button only works when something is selected.
        // (Items can be removed elsewhere, so check it's still on the page)
        if (selectedItem !== null && !selectedItem.isConnected) selectedItem = null;
        document.getElementById("deleteButton").disabled = selectedItem === null;
        updatePropertiesPanel();
      }

      // Quick colour buttons: change the colour picker's value.
      // Picking a colour while the Eraser is on switches back to the Brush,
      // because you clearly want to draw in that colour
      function setColour(colour) {
        document.getElementById("brushColour").value = colour;
        if (tool === "eraser") setTool("brush");
      }
      document.getElementById("brushColour").addEventListener("input", function () {
        if (tool === "eraser") setTool("brush");
      });

      // Save Picture button: downloads the drawing as a .png image.
      // Text boxes and shapes aren't part of the canvas, so we make a copy
      // of the drawing and paint them onto the copy before saving it.
      function savePicture() {
        // Only save the part of the canvas you can see
        // (the canvas can be bigger than its box, see fitCanvas)
        const box = document.getElementById("canvasBox");
        const copy = document.createElement("canvas");
        copy.width = box.clientWidth;
        copy.height = box.clientHeight;
        const copyPen = copy.getContext("2d");
        // The drawing is see-through where nothing is drawn (or where it was
        // erased), so give the saved picture a white background first
        copyPen.fillStyle = "white";
        copyPen.fillRect(0, 0, copy.width, copy.height);
        copyPen.drawImage(canvas, 0, 0);

        // Go through items in order, so ones on top stay on top
        for (const item of document.querySelectorAll(".canvasItem")) {
          // If the item is rotated, rotate the pen the same way around the
          // item's middle. save() and restore() put the pen back after
          copyPen.save();
          const middleX = parseFloat(item.style.left) + item.offsetWidth / 2;
          const middleY = parseFloat(item.style.top) + item.offsetHeight / 2;
          copyPen.translate(middleX, middleY);
          copyPen.rotate(Number(item.dataset.angle || 0) * Math.PI / 180);
          copyPen.translate(-middleX, -middleY);

          if (item.classList.contains("shapeItem")) {
            drawShapeOnto(copyPen, item);
          } else {
            drawTextOnto(copyPen, item);
          }
          copyPen.restore();
        }

        const link = document.createElement("a");
        link.download = "my-drawing.png";        // the file name
        link.href = copy.toDataURL("image/png"); // the picture
        link.click();                            // pretend to click it
      }

      // Paint a text box onto a canvas, for Save Picture
      function drawTextOnto(copyPen, item) {
        const text = item.querySelector(".textInside");
        const size = Number(item.dataset.size);
        const box = getComputedStyle(text);
        const outline = parseFloat(box.borderLeftWidth) || 0; // box outline (0 = none)
        const padLeft = parseFloat(box.paddingLeft);
        const padTop = parseFloat(box.paddingTop);

        // The box: +1 skips the item's own 1px border
        const boxX = parseFloat(item.style.left) + 1;
        const boxY = parseFloat(item.style.top) + 1;
        const boxW = text.offsetWidth;
        const boxH = text.offsetHeight;
        // Fill first, so the text goes on top of it
        if ((item.dataset.fill || "none") !== "none") {
          copyPen.fillStyle = item.dataset.fill;
          copyPen.fillRect(boxX, boxY, boxW, boxH);
        }
        // The outline sits just inside the box's edge
        if (outline > 0) {
          copyPen.strokeStyle = box.borderLeftColor;
          copyPen.lineWidth = outline;
          copyPen.lineJoin = "miter";
          copyPen.strokeRect(boxX + outline / 2, boxY + outline / 2, boxW - outline, boxH - outline);
        }

        copyPen.textBaseline = "top";
        // Skip the outline and padding. The 0.1 * size matches the line height.
        let x = boxX + outline + padLeft;
        const y = boxY + outline + padTop + 0.1 * size;

        // Different bits of the text can have different fonts and colours,
        // so paint each bit with its own font and colour, one after the other
        const walker = document.createTreeWalker(text, NodeFilter.SHOW_TEXT);
        while (walker.nextNode()) {
          const piece = walker.currentNode;
          const look = getComputedStyle(piece.parentElement);
          copyPen.font = look.fontWeight + " " + size + "px " + look.fontFamily;
          copyPen.fillStyle = look.color;
          // Thickness: draw the outline first, then the letters on top
          const letterOutline = parseFloat(look.webkitTextStrokeWidth) || 0;
          if (letterOutline > 0) {
            copyPen.strokeStyle = look.color;
            copyPen.lineWidth = letterOutline;
            copyPen.lineJoin = "round";
            copyPen.strokeText(piece.textContent, x, y);
          }
          copyPen.fillText(piece.textContent, x, y);
          x = x + copyPen.measureText(piece.textContent).width; // move along
        }
      }

      // Paint a shape item onto a canvas, for Save Picture
      function drawShapeOnto(p, item) {
        // +1 skips the item's 1px border
        const x = parseFloat(item.style.left) + 1;
        const y = parseFloat(item.style.top) + 1;
        const w = parseFloat(item.style.width);
        const h = parseFloat(item.style.height);

        p.strokeStyle = item.dataset.colour;
        p.lineWidth = item.dataset.thickness;
        p.lineCap = "round";
        p.lineJoin = "round";
        p.beginPath();
        if (item.dataset.shape === "rectangle") {
          p.rect(x, y, w, h);
        } else if (item.dataset.shape === "circle") {
          // centre x, centre y, half width, half height, turn, start, end angle
          p.ellipse(x + w / 2, y + h / 2, w / 2, h / 2, 0, 0, Math.PI * 2);
        } else if (item.dataset.shape === "triangle") {
          p.moveTo(x + w / 2, y);  // top middle
          p.lineTo(x + w, y + h);  // bottom right
          p.lineTo(x, y + h);      // bottom left
          p.closePath();           // back to the top
        } else {
          p.moveTo(x, y + h);      // line: bottom left...
          p.lineTo(x + w, y);      // ...to top right
        }
        // Fill first, then the outline on top (like the screen does)
        const isLine = item.dataset.shape === "line";
        if (!isLine && (item.dataset.fill || "none") !== "none") {
          p.fillStyle = item.dataset.fill;
          p.fill();
        }
        if (isLine || item.dataset.outline !== "off") p.stroke();
      }

      // Wipe the whole drawing, so it's completely see-through (empty).
      // The white you see is the canvas's background, behind the drawing
      function clearCanvas() {
        pen.clearRect(0, 0, canvas.width, canvas.height);
        // Back to normal drawing, so putting a picture back (for Undo or
        // resizing) draws it, instead of erasing with it
        pen.globalCompositeOperation = "source-over";
      }

      // Clear / New Drawing buttons: wipe the drawing, and remove all
      // text boxes and shapes
      function clearDrawing() {
        clearCanvas();
        selectItem(null);
        lineEnds.length = 0; // forget all the line ends (empties the list)
        hideDot();
        for (const box of document.querySelectorAll(".canvasItem")) {
          box.remove();
        }
        canvasChanged = true;
        saveState(); // so you can Undo a Clear too
      }

      // Start with the Home tab open (this also sizes the canvas to fit)
      toggleMenu("home");
      // Start with the Brush tool picked
      setTool("brush");
      // The first snapshot: the empty canvas. Undo can go back to here
      saveState();
    </script>
  </body>
</html>
